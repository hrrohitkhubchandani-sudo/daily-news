<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today’s Official News</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--bd:#e3e3dc;--ac:#1a5fb4;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#21211f;--tx:#f0efe9;--mut:#a3a29a;--bd:#3a3a36;--ac:#7ab2ff;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.w{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.t{min-width:52px;font-weight:700;font-variant-numeric:tabular-nums}
.src{font-size:12px;color:var(--mut);margin-top:4px}
a{color:var(--ac)}
.item a.h{color:var(--tx);font-weight:600;text-decoration:none}
.note{font-size:13px;color:var(--mut);margin-top:18px}
</style>
</head>
<body>
<div class="w">
<h1>🗞️ Today’s Official News</h1>
<p class="sub" id="meta">Loading…</p>
<div id="list"></div>
<p class="note">Every headline here is copied unchanged from an official source and links to the original. Nothing is written or changed by AI. This page clears itself every day.</p>
</div>
<script>
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function todayIST(){return new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Kolkata"})}
function load(){
 fetch("news.json?"+Date.now()).then(function(r){return r.json()}).then(function(d){
  var meta=document.getElementById("meta"),list=document.getElementById("list");
  if(d.date!==todayIST()){meta.textContent="No news for today yet. Check back soon.";list.innerHTML="";return}
  meta.textContent=d.date+" · "+d.items.length+" updates · last checked "+d.updated+" IST";
  if(!d.items.length){list.innerHTML="<p>No official updates published yet today.</p>";return}
  list.innerHTML=d.items.map(function(i){
   return "<div class='item'><div class='t'>"+esc(i.time)+"</div><div><a class='h' href='"+esc(i.link)+"' target='_blank' rel='noopener'>"+esc(i.title)+"</a><div class='src'>Source: "+esc(i.source)+" · <a href='"+esc(i.link)+"' target='_blank' rel='noopener'>Read original</a></div></div></div>";
  }).join("");
 }).catch(function(){document.getElementById("meta").textContent="Could not load news right now."});
}
load();setInterval(load,300000);
</script>
</body>
</html>
